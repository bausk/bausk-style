# bausk-style · look "sheet" · light · generated, do not edit.
# Copied into a Quarto project as _brand.yml by `bausk-style init --media slides`, with fonts/ next to it.
meta:
  name:
    full: "Oleksandr Bausk"
    short: "Bausk"
  link:
    home: https://bausk.dev
color:
  palette:
    fg: "#1b2025"
    fg-muted: "#43484e"
    fg-subtle: "#5f646a"
    bg: "#f4f7f8"
    bg-subtle: "#e9eeef"
    line: "#caced1"
    accent: "#c52f15"
    viz-1: "#1b2025"
    viz-2: "#c52f15"
    viz-3: "#1762b6"
    viz-4: "#3d8e53"
    viz-5: "#b6770b"
    viz-6: "#5288a2"
  foreground: fg
  background: bg
  primary: accent
  secondary: fg-muted
  tertiary: line
  success: "#246e3a"
  info: viz-1
  warning: "#9d6300"
  danger: "#c52f15"
  light: bg
  dark: fg
typography:
  fonts:
    - source: file
      family: "BS IBM Plex Sans"
      files:
        - path: fonts/plex-sans/ibm-plex-sans-cyrillic-standard-normal.woff2
          weight: "100 700"
          style: normal
        - path: fonts/plex-sans/ibm-plex-sans-latin-standard-normal.woff2
          weight: "100 700"
          style: normal
        - path: fonts/plex-sans/ibm-plex-sans-cyrillic-standard-italic.woff2
          weight: "100 700"
          style: italic
        - path: fonts/plex-sans/ibm-plex-sans-latin-standard-italic.woff2
          weight: "100 700"
          style: italic
    - source: file
      family: "BS IBM Plex Mono"
      files:
        - path: fonts/plex-mono/ibm-plex-mono-cyrillic-400-normal.woff2
          weight: "400"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-latin-400-normal.woff2
          weight: "400"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-cyrillic-500-normal.woff2
          weight: "500"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-latin-500-normal.woff2
          weight: "500"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-cyrillic-600-normal.woff2
          weight: "600"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-latin-600-normal.woff2
          weight: "600"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-cyrillic-400-italic.woff2
          weight: "400"
          style: italic
        - path: fonts/plex-mono/ibm-plex-mono-latin-400-italic.woff2
          weight: "400"
          style: italic
  base:
    family: "BS IBM Plex Sans"
    line-height: 1.6
  headings:
    family: "BS IBM Plex Sans"
    weight: 600
    line-height: 1.15
  monospace:
    family: "BS IBM Plex Mono"
    size: 0.9em
  link:
    color: accent
    decoration: underline
