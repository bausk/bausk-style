# bausk-style · look "folio" · dark · generated, do not edit.
# Copied into a Quarto project as _brand.yml by `bausk-style init --media slides`, with fonts/ next to it.
meta:
  name:
    full: "Oleksandr Bausk"
    short: "Bausk"
  link:
    home: https://bausk.dev
color:
  palette:
    fg: "#ece9e2"
    fg-muted: "#c4bfb4"
    fg-subtle: "#9c968a"
    bg: "#1a1917"
    bg-subtle: "#242320"
    line: "#3a3833"
    accent: "#e0846f"
    viz-1: "#ece9e2"
    viz-2: "#e0846f"
    viz-3: "#6fb5ae"
    viz-4: "#d9a548"
    viz-5: "#7fa6d6"
    viz-6: "#a5b86a"
  foreground: fg
  background: bg
  primary: accent
  secondary: fg-muted
  tertiary: line
  success: "#a5b86a"
  info: viz-1
  warning: "#d9a548"
  danger: "#e0846f"
  light: bg
  dark: fg
typography:
  fonts:
    - source: file
      family: "BS Source Serif 4"
      files:
        - path: fonts/source-serif-4/source-serif-4-cyrillic-opsz-normal.woff2
          weight: "200 900"
          style: normal
        - path: fonts/source-serif-4/source-serif-4-latin-opsz-normal.woff2
          weight: "200 900"
          style: normal
        - path: fonts/source-serif-4/source-serif-4-cyrillic-opsz-italic.woff2
          weight: "200 900"
          style: italic
        - path: fonts/source-serif-4/source-serif-4-latin-opsz-italic.woff2
          weight: "200 900"
          style: italic
    - source: file
      family: "BS Source Sans 3"
      files:
        - path: fonts/source-sans-3/source-sans-3-cyrillic-wght-normal.woff2
          weight: "200 900"
          style: normal
        - path: fonts/source-sans-3/source-sans-3-latin-wght-normal.woff2
          weight: "200 900"
          style: normal
    - source: file
      family: "BS Source Code Pro"
      files:
        - path: fonts/source-code-pro/source-code-pro-cyrillic-wght-normal.woff2
          weight: "200 900"
          style: normal
        - path: fonts/source-code-pro/source-code-pro-latin-wght-normal.woff2
          weight: "200 900"
          style: normal
  base:
    family: "BS Source Serif 4"
    line-height: 1.62
  headings:
    family: "BS Source Serif 4"
    weight: 600
    line-height: 1.2
  monospace:
    family: "BS Source Code Pro"
    size: 0.9em
  link:
    color: accent
    decoration: underline
