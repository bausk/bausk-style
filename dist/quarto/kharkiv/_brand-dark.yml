# bausk-style · look "kharkiv" · dark · generated, do not edit.
# Copied into a Quarto project as _brand.yml by `bausk-style init --media slides`, with fonts/ next to it.
meta:
  name:
    full: "Oleksandr Bausk"
    short: "Bausk"
  link:
    home: https://bausk.dev
color:
  palette:
    fg: "#f1f0ee"
    fg-muted: "#bfbebb"
    fg-subtle: "#999895"
    bg: "#100f0e"
    bg-subtle: "#1c1a19"
    line: "#373534"
    accent: "#ed4b40"
    viz-1: "#f1f0ee"
    viz-2: "#ed4b40"
    viz-3: "#7d7a77"
    viz-4: "#67a3e0"
    viz-5: "#f0ba59"
    viz-6: "#7aa671"
  foreground: fg
  background: bg
  primary: accent
  secondary: fg-muted
  tertiary: line
  success: "#7aa671"
  info: viz-1
  warning: "#f0ba59"
  danger: "#ed4b40"
  light: bg
  dark: fg
typography:
  fonts:
    - source: file
      family: "BS Arsenal"
      files:
        - path: fonts/arsenal/arsenal-cyrillic-400-normal.woff2
          weight: "400"
          style: normal
        - path: fonts/arsenal/arsenal-latin-400-normal.woff2
          weight: "400"
          style: normal
        - path: fonts/arsenal/arsenal-cyrillic-700-normal.woff2
          weight: "700"
          style: normal
        - path: fonts/arsenal/arsenal-latin-700-normal.woff2
          weight: "700"
          style: normal
        - path: fonts/arsenal/arsenal-cyrillic-400-italic.woff2
          weight: "400"
          style: italic
        - path: fonts/arsenal/arsenal-latin-400-italic.woff2
          weight: "400"
          style: italic
        - path: fonts/arsenal/arsenal-cyrillic-700-italic.woff2
          weight: "700"
          style: italic
        - path: fonts/arsenal/arsenal-latin-700-italic.woff2
          weight: "700"
          style: italic
    - source: file
      family: "BS Fixel"
      files:
        - path: fonts/fixel/fixel-variable.woff2
          weight: "100 900"
          style: normal
    - source: file
      family: "BS IBM Plex Mono"
      files:
        - path: fonts/plex-mono/ibm-plex-mono-cyrillic-400-normal.woff2
          weight: "400"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-latin-400-normal.woff2
          weight: "400"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-cyrillic-500-normal.woff2
          weight: "500"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-latin-500-normal.woff2
          weight: "500"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-cyrillic-600-normal.woff2
          weight: "600"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-latin-600-normal.woff2
          weight: "600"
          style: normal
        - path: fonts/plex-mono/ibm-plex-mono-cyrillic-400-italic.woff2
          weight: "400"
          style: italic
        - path: fonts/plex-mono/ibm-plex-mono-latin-400-italic.woff2
          weight: "400"
          style: italic
  base:
    family: "BS Arsenal"
    line-height: 1.55
  headings:
    family: "BS Fixel"
    weight: 900
    line-height: 0.98
  monospace:
    family: "BS IBM Plex Mono"
    size: 0.9em
  link:
    color: accent
    decoration: underline
