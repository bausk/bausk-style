[project]
name = "bausk-style"
version = "0.1.0"
description = "Oleksandr Bausk's house style for matplotlib and Plotly: colours, fonts and figure presets generated from the bausk-style tokens."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.7"]
plotly = ["plotly>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bausk_style"]
